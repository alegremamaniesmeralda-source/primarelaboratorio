site_name: Documentación - Taller de Programación
site_author: "Tu Nombre / Grupo"
site_description: "Documentación oficial del proyecto final"

dev_addr: '127.0.0.1:8080'

theme:
  name: material
  language: es
  palette:
    scheme: default
    primary: indigo
    accent: deep orange
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - search.suggest
    - search.highlight

nav:
  - Inicio: index.md
  - Instalación y Requisitos: instalacion.md
  - Arquitectura del Sistema: arquitectura.md
  - Guía de Uso: guia-uso.md
  - API / Módulos: api.md
  # --- Actividad 4.1: Secciones personalizadas adicionadas ---
  - Diagramas de Clases: diagramas.md
  - Pruebas Unitarias: pruebas.md
  - Conclusiones: conclusiones.md

plugins:
  - search

markdown_extensions:
  - admonition
  - codehilite:
      guess_lang: false
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences